<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Використовуємо PNG іконку, яку ми додали в public -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Cards — EvoGaming</title>

    <!-- ШРИФТИ (Залишаємо в HTML для швидкого завантаження) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&family=Rubik:wght@900&display=swap"
      rel="stylesheet"
    />

    <style>
      /* СТИЛІ ПРЕЛОАДЕРА (Вбудовані, щоб вони з'явилися миттєво до завантаження JS) */
      body {
        margin: 0;
        background-color: #0b0f16;
        color: white;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0b0f16;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition:
          opacity 0.8s ease,
          visibility 0.8s ease;
      }

      #preloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .logo-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #ff4b81 0%, #ffbc00 100%);
        border-radius: 50%;
        position: relative;
        margin-right: 12px;
      }

      .logo-icon::after {
        content: "";
        position: absolute;
        bottom: 4px;
        left: 50%;
        transform: translateX(-50%);
        width: 14px;
        height: 6px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 10px;
      }

      .progress-container {
        width: 250px;
        height: 3px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        margin-top: 20px;
        overflow: hidden;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #8653fc, #a64cf4);
        animation: loadAnim 2.2s ease-in-out forwards;
      }

      @keyframes loadAnim {
        0% {
          width: 0%;
        }
        100% {
          width: 100%;
        }
      }

      /* Глобальне приховування стрілок в інпутах */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- ЕКРАН ЗАВАНТАЖЕННЯ -->
    <div id="preloader">
      <div style="display: flex; align-items: center">
        <div class="logo-icon"></div>
        <span
          style="
            color: white;
            font-family: &quot;Rubik&quot;, sans-serif;
            font-weight: 900;
            font-size: 32px;
            letter-spacing: -1px;
          "
        >
          EVOGAMING
        </span>
      </div>
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
    </div>

    <!-- КОРІНЬ ПРОЄКТУ -->
    <div id="root"></div>

    <!-- ПІДКЛЮЧЕННЯ ЛОГІКИ (Vite сам обробить Tailwind через імпорти в main.tsx) -->
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Логіка приховування прелоадера
      window.addEventListener("load", () => {
        const preloader = document.getElementById("preloader");
        setTimeout(() => {
          preloader.classList.add("hidden");
          setTimeout(() => {
            preloader.style.display = "none";
          }, 1000);
        }, 2500);
      });
    </script>
  </body>
</html>
